name: "Verify — LLM judge agent (diagnostic)"

# ⚠️ DIAGNOSTIC ONLY — ไม่ใช่งานจริงของ feature
# มีไว้เพื่อดึงตัวเลข pytest จริง (session agent ไม่มี shell ในเครื่อง)
# ลบทิ้งหลังอ่านผลแล้ว

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: "A = declared deps (central_bus/requirements.txt) + numpy/extra"
            install: >-
              pip install pytest pytest-cov coverage pytest-asyncio
              && pip install -r central_bus/requirements.txt
              && pip install numpy pyyaml requests python-dotenv python-frontmatter
              gitpython jsonschema mcp python-multipart sse-starlette
          - label: "B = local .venv mirror (versions from .venv/lib/python3.12/site-packages)"
            install: >-
              pip install pytest==9.1.1 pytest-asyncio==1.4.0 pytest-cov==7.1.0
              coverage==7.15.0 pytest-random-order==1.2.0
              fastapi==0.139.0 starlette==1.3.1 "uvicorn[standard]==0.50.0"
              aiosqlite==0.22.1 pydantic==2.13.4 pydantic-settings==2.14.2
              httpx==0.28.1 numpy==2.5.0 pyyaml==6.0.3 requests==2.34.2
              python-dotenv==1.2.2 python-frontmatter==1.3.0 gitpython==3.1.50
              jsonschema==4.26.0 mcp==1.28.1 python-multipart==0.0.32
              sse-starlette==3.4.5 typer==0.26.8 rich==15.0.0 markdown-it-py==4.2.0

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        continue-on-error: true
        if: always()
        run: |
          set -x
          python -m pip install --upgrade pip
          ${{ matrix.install }}

      - name: Run new test file
        id: new_test
        continue-on-error: true
        if: always()
        run: |
          python -m pytest tests/test_llm_provider_judge_agent.py --tb=short --no-header -q -p no:cacheprovider 2>&1 | tee new-test-output.txt
          echo "exit_code=${PIPESTATUS[0]}" >> $GITHUB_OUTPUT

      - name: Run full suite
        id: full_test
        continue-on-error: true
        if: always()
        run: |
          python -m pytest tests/ central_bus/tests/ --tb=short --no-header -q -p no:cacheprovider 2>&1 | tee full-test-output.txt
          echo "exit_code=${PIPESTATUS[0]}" >> $GITHUB_OUTPUT

      - name: Post result to PR
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          NEW_EXIT: ${{ steps.new_test.outputs.exit_code }}
          FULL_EXIT: ${{ steps.full_test.outputs.exit_code }}
          LABEL: ${{ matrix.label }}
        run: |
          {
            echo "### 🔍 Diagnostic [$LABEL]"
            echo
            echo "**new test file** exit=${NEW_EXIT}"
            echo '```'
            grep -E "passed|failed|error|Error" new-test-output.txt | tail -c 1500 || echo "(no output)"
            echo '```'
            echo
            echo "**full suite** exit=${FULL_EXIT}"
            echo '```'
            tail -c 5000 full-test-output.txt
            echo '```'
          } > result.md
          gh pr comment "$PR_NUMBER" --body-file result.md
