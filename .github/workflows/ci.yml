name: "CI — Auto-QA Pipeline"

# SoloCorp OS Continuous Integration
# Every PR + push to main triggers:
#   1. Lint / Type check
#   2. Test suite with coverage
#   3. Auto-QA Gate (coverage threshold check)
#
# SOP-04: ต้องผ่าน gate นี้ก่อน deploy

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test-and-coverage:
    name: "Tests + Coverage Gate"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov coverage pytest-asyncio
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f central_bus/requirements.txt ]; then pip install -r central_bus/requirements.txt; fi

      - name: Run tests with coverage
        run: |
          python -m pytest tests/ central_bus/tests/ --tb=short --cov-report=json:.coverage.json --no-header -q 2>&1 | tee test-output.txt
        continue-on-error: true

      - name: Run Auto-QA Gate
        id: qa-gate
        run: |
          set -o pipefail
          python workers/auto_qa_gate.py --threshold=9 --project-id=auto-qa-pipeline --test-path="tests central_bus/tests" 2>&1 | tee gate-output.txt
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      - name: Upload Evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qa-evidence
          path: |
            bus/evidence/**/*.json
            .coverage.json
            test-output.txt
            gate-output.txt
          if-no-files-found: ignore

      - name: Gate Result
        if: steps.qa-gate.outputs.exit_code != '0'
        run: |
          echo "::error::❌ Auto-QA Gate FAILED — Coverage below threshold or tests failed"
          exit 1
