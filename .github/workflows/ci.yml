name: "CI — Auto-QA Pipeline"

# SoloCorp OS Continuous Integration
# Every PR + push to main triggers:
#   1. Lint / Type check
#   2. Test suite with coverage
#   3. Auto-QA Gate (coverage threshold check)
#
# SOP-04: ต้องผ่าน gate นี้ก่อน deploy

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  # ────────────────────────────────────────────────────────────────────────
  # Config Lint — opencode.jsonc vs. what is on disk (Wave 2, 2026-11-23)
  #
  # Phase 1 = WARN-ONLY. Findings are printed in the job log but never block.
  # FLIP DATE: 2026-11-30 → remove `--warn-only` AND `continue-on-error: true`
  # to make this a blocking gate. Do not flip earlier: the repo has known
  # pre-existing drift that Wave 4 (permission precedence proof) still owns.
  # ────────────────────────────────────────────────────────────────────────
  config-lint:
    name: "Config Lint (skills / agents / permissions)"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # Stdlib only — no pip install needed.
      - name: Validate opencode config (warn-only until 2026-11-30)
        continue-on-error: true
        run: python3 scripts/validate-opencode-config.py --warn-only

  test-and-coverage:
    name: "Tests + Coverage Gate"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov coverage pytest-asyncio
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f central_bus/requirements.txt ]; then pip install -r central_bus/requirements.txt; fi

      - name: Run tests with coverage
        run: |
          python -m pytest tests/ central_bus/tests/ --tb=short --cov-report=json:.coverage.json --no-header -q 2>&1 | tee test-output.txt
        continue-on-error: true

      - name: Verify Specialist Manifest is current
        run: |
          python3 scripts/generate-specialist-manifest.py --check

      - name: Run Auto-QA Gate
        id: qa-gate
        run: |
          set -o pipefail
          python workers/auto_qa_gate.py --threshold=9 --project-id=auto-qa-pipeline --test-path="tests central_bus/tests" 2>&1 | tee gate-output.txt
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      - name: Upload Evidence
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: qa-evidence
          path: |
            bus/evidence/**/*.json
            .coverage.json
            test-output.txt
            gate-output.txt
          if-no-files-found: ignore

      - name: Gate Result
        if: steps.qa-gate.outputs.exit_code != '0'
        run: |
          echo "::error::❌ Auto-QA Gate FAILED — Coverage below threshold or tests failed"
          exit 1
