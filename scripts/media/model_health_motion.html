<!doctype html>
<html lang="th"><meta charset="utf-8">
<style>html,body{margin:0;background:#0b1020;overflow:hidden}canvas{display:block}body{font-family:'Noto Sans Thai',sans-serif}</style>
<canvas id="film" width="1080" height="1920"></canvas>
<script>
const canvas=document.getElementById('film'),g=canvas.getContext('2d');
const C={bg:'#0b1020',panel:'#141d30',inset:'#0d1626',line:'#2b3a50',white:'#f1f5f8',muted:'#a7b6c7',mint:'#76efd0',red:'#ff7d87',amber:'#ffd58a',blue:'#88baff'};
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const ease=x=>1-Math.pow(1-clamp(x),3);
const font=(size,weight=500,mono=false)=>`${weight} ${size}px ${mono?'"DejaVu Sans Mono"':'"Noto Sans Thai",sans-serif'}`;
function text(s,x,y,size=38,color=C.white,weight=500,align='left',mono=false){g.font=font(size,weight,mono);g.fillStyle=color;g.textAlign=align;g.textBaseline='alphabetic';g.fillText(s,x,y);}
function rr(x,y,w,h,r=24,fill=C.panel,stroke=null){g.beginPath();g.roundRect(x,y,w,h,r);g.fillStyle=fill;g.fill();if(stroke){g.strokeStyle=stroke;g.lineWidth=2;g.stroke();}}
function line(x1,y1,x2,y2,color=C.line,width=3){g.beginPath();g.moveTo(x1,y1);g.lineTo(x2,y2);g.strokeStyle=color;g.lineWidth=width;g.stroke();}
function dot(x,y,r,color){g.beginPath();g.arc(x,y,r,0,Math.PI*2);g.fillStyle=color;g.fill();}
function tag(label,x,y,color=C.mint,width=220){rr(x,y,width,55,27,C.inset,color);text(label,x+width/2,y+37,25,color,650,'center');}
function check(x,y,color=C.mint){g.beginPath();g.moveTo(x-13,y);g.lineTo(x-3,y+11);g.lineTo(x+18,y-15);g.strokeStyle=color;g.lineWidth=5;g.lineCap='round';g.lineJoin='round';g.stroke();}
function stage(progress,delay,draw){const p=ease((progress-delay)/.12);g.save();g.globalAlpha=p;g.translate(0,(1-p)*28);draw(p);g.restore();}
function card(x,y,w,h,draw){g.save();g.shadowColor='#0008';g.shadowBlur=28;g.shadowOffsetY=14;rr(x,y,w,h,28,C.panel,C.line);g.restore();draw();}
function windowBar(x,y,w,label){rr(x,y,w,72,22,'#1a263a');for(let k=0;k<3;k++)dot(x+28+k*23,y+35,6,[C.red,C.amber,C.mint][k]);text(label,x+w-24,y+45,23,C.muted,500,'right',true);}
const captionBreaks={
 'แล้วตรวจว่าคำตอบตรงกับที่คาดไว้หรือไม่':['แล้วตรวจว่าคำตอบ','ตรงกับที่คาดไว้หรือไม่'],
 'พร้อมคำตอบ หรือรายละเอียดเมื่อเกิดข้อผิดพลาด':['พร้อมคำตอบ หรือรายละเอียด','เมื่อเกิดข้อผิดพลาด'],
 'ถ้าเรียกไม่ได้ ให้แสดงข้อผิดพลาดตรง ๆ':['ถ้าเรียกไม่ได้','ให้แสดงข้อผิดพลาดตรง ๆ'],
 'แจ้งเจ้าของงาน พร้อมหลักฐานที่ตามกลับได้':['แจ้งเจ้าของงาน','พร้อมหลักฐานที่ตามกลับได้']
};
function splitText(value,maxWidth,size=53){if(captionBreaks[value])return captionBreaks[value];g.font=font(size,550);const tokens=[...new Intl.Segmenter('th',{granularity:'word'}).segment(value)].map(x=>x.segment);let rows=[],row='';for(const token of tokens){if(g.measureText(row+token).width>maxWidth&&row){rows.push(row.trim());row=token.trimStart();}else row+=token;}if(row.trim())rows.push(row.trim());return rows;}
function headline(s,p){const a=ease(p/.10);g.save();g.globalAlpha=a;g.translate(0,(1-a)*24);text(s.kicker||'MODEL HEALTH CHECK',76,254,28,C.mint,650);s.title.forEach((v,i)=>text(v,76,365+i*112,86,i===s.title.length-1?C.mint:C.white,750));g.restore();}
function status(s,p,t){
 card(76,650,928,492,()=>{windowBar(76,650,928,'WORKFLOW / DEMO');text('สถานะที่ระบบรายงาน',118,785,31,C.muted);tag('รับคำสั่งแล้ว',684,751,C.mint,270);text('SUCCESS',118,898,100,C.mint,750,'left',true);line(118,941,960,941);text('หลักฐานจากโมเดล',118,1011,34,C.white,600);stage(p,.27,()=>{dot(145,1072,9,C.amber);text('ยังไม่พบคำตอบ',175,1086,35,C.amber,650);});});
 stage(p,.48,()=>{rr(105,1200,870,119,23,'#2a2130','#70505b');text('สถานะสีเขียว ≠ หลักฐานว่างานเสร็จ',540,1274,38,C.white,650,'center');});
}
function split(s,p,t){
 stage(p,0,()=>card(76,625,928,240,()=>{tag('ACCEPTED',115,660,C.mint,250);text('ระบบรับงานแล้ว',115,800,54,C.white,700);check(925,776);}));
 const y=888;line(540,y,540,y+92,C.line,4);const v=(t*.5)%1;dot(540,y+v*90,8,C.mint);
 stage(p,.20,()=>card(76,1005,928,270,()=>{tag('VERIFIED?',115,1040,C.amber,250);text('โมเดลตอบกลับหรือยัง?',115,1170,51,C.white,700);text('ต้องตรวจอีกชั้น',115,1227,31,C.amber,600);}));
}
function probe(s,p,t){
 const nodes=[{x:76,label:'คำขอทดสอบ'},{x:630,label:'ปลายทางโมเดล'}];
 nodes.forEach(n=>card(n.x,610,374,142,()=>text(n.label,n.x+187,699,32,C.white,650,'center')));
 line(466,682,614,682,C.line,4);const px=466+148*((t*.52)%1);dot(px,682,7,p<.62?C.blue:C.mint);
 card(76,815,928,520,()=>{windowBar(76,815,928,'HEALTH PROBE / SIMULATED');const rows=[['>','คำขอ: ตอบคำว่า “พร้อม”',C.blue],['→','รอคำตอบจากปลายทาง',C.muted],['✓','คำตอบ: “พร้อม”',C.mint],['✓','ผลตรวจ: ตอบกลับได้',C.mint]];rows.forEach((r,i)=>stage(p,.08+i*.16,()=>{text(r[0],118,975+i*93,37,r[2],650);text(r[1],175,975+i*93,36,r[2],550);}));});
}
function evidence(s,p,t){
 card(76,610,928,722,()=>{windowBar(76,610,928,'RUN RECORD / SIMULATED');tag('TRACEABLE',690,711,C.mint,266);text('หลักฐานหนึ่งชุด',118,758,42,C.white,700);const rows=[['provider','demo-provider'],['model','demo-model'],['request','ตอบคำว่า “พร้อม”'],['response','พร้อม'],['checked_at','เวลาที่ตรวจจริง']];rows.forEach((r,i)=>stage(p,.04+i*.12,()=>{const y=838+i*88;rr(108,y-47,864,72,12,i%2?C.panel:C.inset);text(r[0],132,y,29,C.blue,500,'left',true);text(r[1],932,y,29,i===3?C.mint:C.white,600,'right',i<2); }));});
}
function alert(s,p,t){
 card(76,610,928,330,()=>{text('ตรวจสุขภาพอย่างต่อเนื่อง',118,685,34,C.white,650);text('คำตอบจากปลายทาง',118,734,27,C.muted);const points=[[118,858],[232,858],[306,815],[381,860],[487,859],[559,807],[637,859],[744,859],[800,859],[939,859]];g.beginPath();points.forEach((v,i)=>{if(i===0)g.moveTo(...v);else g.lineTo(...v)});g.strokeStyle=C.mint;g.lineWidth=5;g.stroke();const reveal=clamp((p-.25)/.3);rr(780,770,185,129,0,C.panel);line(784,858,784+160*reveal,858,C.red,5);dot(784+160*reveal,858,8,C.red);});
 stage(p,.30,()=>{card(76,995,928,255,()=>{tag('ALERT',118,1034,C.red,190);text('ไม่พบคำตอบ',118,1162,56,C.white,700);text('ส่งต่อผู้ดูแล พร้อมหลักฐาน',118,1210,30,C.muted);dot(918,1088,23+3*Math.sin(t*4),C.red);});});
 stage(p,.55,()=>{text('ตรวจ → แจ้งเตือน → ติดตามผล',540,1352,35,C.mint,600,'center');});
}
function question(s,p,t){
 const labels=['ลองเรียกจริง','เก็บผลที่ตรวจได้','เปิดให้คนอื่นตรวจซ้ำ'];
 labels.forEach((v,i)=>stage(p,.03+i*.13,()=>{card(76,626+i*166,928,134,()=>{dot(148,693+i*166,31,'#254237');check(148,693+i*166);text(v,211,709+i*166,43,C.white,650);});}));
 stage(p,.48,()=>{rr(76,1188,928,155,25,'#76efd0');text('เอเจนต์ของคุณ',540,1254,42,C.bg,700,'center');text('มีอะไรให้ตรวจย้อนกลับ?',540,1311,43,C.bg,750,'center');});
}
const drawKinds={status,split,probe,evidence,alert,question};
window.renderFrame=function(time){
 const story=window.story;time=clamp(time,0,story.duration-.001);const s=story.scenes.find(x=>time>=x.start&&time<x.end)||story.scenes.at(-1),index=story.scenes.indexOf(s),local=time-s.start,p=local/(s.end-s.start);
 g.clearRect(0,0,1080,1920);g.fillStyle=C.bg;g.fillRect(0,0,1080,1920);
 const glow=g.createRadialGradient(950,550,0,950,550,900);glow.addColorStop(0,'#183d493b');glow.addColorStop(1,'#0b102000');g.fillStyle=glow;g.fillRect(0,0,1080,1920);
 g.save();g.globalAlpha=.16;for(let x=36;x<1080;x+=48)for(let y=190;y<1470;y+=48)dot(x,y,1,C.muted);g.restore();
 text('SOLOCORP',76,118,33,C.white,750);text('BUILD NOTES',299,118,23,C.muted,500);tag('ตัวอย่างจำลอง',746,73,C.amber,258);line(76,168,1004,168,C.line,2);
 headline(s,p);const alpha=ease(local/.35);g.save();g.globalAlpha=alpha;g.translate(0,18*(1-alpha));drawKinds[s.kind](s,p,local);g.restore();
 const cue=s.cues.find(x=>time>=x.start&&time<x.end);
 if(cue){const rows=splitText(cue.text,850,53);if(rows.length>2)throw new Error('caption exceeds two lines: '+cue.text);rr(76,1490,928,rows.length===1?135:204,24,'#18263ce8');rows.forEach((v,i)=>text(v,540,1572+i*70,53,C.white,550,'center'));}
 for(let k=0;k<story.scenes.length;k++){const x=76+k*157;rr(x,1790,139,5,2,C.line);if(k<index)rr(x,1790,139,5,2,C.mint);else if(k===index)rr(x,1790,139*clamp(p),5,2,C.mint);}
 text(`${String(index+1).padStart(2,'0')} / ${String(story.scenes.length).padStart(2,'0')}`,76,1846,25,C.muted,500,'left',true);text('ร่างตรวจงาน · เสียงสังเคราะห์',1004,1846,23,C.muted,500,'right');
 const fade=Math.min(clamp(time/.25),clamp((story.duration-time)/.35));if(fade<1){g.fillStyle=`rgba(11,16,32,${1-fade})`;g.fillRect(0,0,1080,1920);}
 return {scene:index,caption:cue?.text||''};
};
</script>
