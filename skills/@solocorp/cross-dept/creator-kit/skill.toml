[skill]
name = "@solocorp/cross-dept/creator-kit"
version = "0.1.0"
description = "สนามแรก: ครีเอเตอร์สายสร้างตัวตน (TikTok) — 4 ท่อน → ไอเดีย → สคริปต์ → แพ็กเกจพร้อมโพสต์"
category = "cross-dept"

[dept]
owner = "cmo"
consumers = ["cmo", "content-creator", "design", "legal", "ceo"]

[bus]
endpoint = "/v1/skills/cross-dept/creator-kit"
queue_topic = "skill.creator.invoke"
lifecycle = "intake_4_tubean → ideas → scripts → package → tiktok_draft → stats"

[mirror]
minimum_level = "L1"
check_on_invoke = false
description = "ผลิตคอนเทนต์ของครีเอเตอร์ ไม่กระทบนโยบาย/เงิน → L1"

[dependencies]
skills = ["@solocorp/engineering/web-read", "@solocorp/engineering/news-feed"]
bus_version = ">=0.6.0"

[[triggers]]
keyword = "/creator-kit"
description = "สร้างคอนเทนต์ให้ครีเอเตอร์สายสร้างตัวตน (TikTok) จาก 4 ท่อน"
platforms = ["opencode", "grok"]

[resources]
core = "solocorp_skills/creator.py"
spec = "brain/field-1-creator-tiktok-20261020.md"
adr = "decisions/ADR-022-first-field-creator-kit.md"
