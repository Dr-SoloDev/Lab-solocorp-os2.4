[pytest]
testpaths = tests
python_files = test_*.py
addopts = -v --tb=short --cov=central_bus --cov-report=term --cov-report=json:.coverage.json --no-header -q -m "not live"
asyncio_mode = auto
markers =
    live: tests requiring live network/docker — quarantined from CI gate (2026-11-22), run explicitly with `-m live`
# --ignore paths if needed
# norecursedirs = .git .venv __pycache__ node_modules
