<!doctype html>
<html lang="th">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}SoloCorp{% endblock %} — SoloCorp App</title>
    <link rel="stylesheet" href="/static/app.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand"><span class="brand-dot"></span>SoloCorp <em>App</em></div>
      <nav class="nav">
        {% for item in nav %}
        <a href="{{ item.href }}" class="nav-link{% if item.key == active_page %} is-active{% endif %}">{{ item.label }}</a>
        {% endfor %}
      </nav>
      <span class="version">v{{ app_version }}</span>
    </header>

    <main class="page">
      {% if notice %}
      <div class="notice notice--{{ notice.kind }}" role="status">{{ notice.text }}</div>
      {% endif %}
      {% block content %}{% endblock %}
    </main>

    <footer class="footer">
      Local-only shell · loopback 127.0.0.1 · Phase 1 (no model calls yet)
    </footer>
    <script src="/static/app.js" defer></script>
  </body>
</html>
