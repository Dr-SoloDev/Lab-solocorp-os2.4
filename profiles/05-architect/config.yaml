custom_providers:
- name: maxplus-codex
  base_url: https://api.maxplus-ai.cc/ox-alpha/v1
  key_env: MAXPLUS_API_KEY
  api_key_env: MAXPLUS_API_KEY
  api_mode: openai_chat
  transport: openai_chat
  discover_models: false
  model: stealth/ox-alpha
  models:
    stealth/ox-alpha:
      context_length: 200000
model:
  default: stealth/ox-alpha
  provider: custom:maxplus-codex
model_aliases:
  ox-alpha:
    model: stealth/ox-alpha
    provider: custom:maxplus-codex
agent:
  max_turns: 40
  reasoning_effort: medium
  # SOUL.md is loaded automatically from profile directory
terminal:
  backend: local
  cwd: ./
  timeout: 180
